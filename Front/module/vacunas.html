<!doctype html>
<html lang="es">
<head>
    <title>Vacunas</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/estilo.css" rel="stylesheet" />
</head>
<body>

    <div class="container mt-4">
        <!-- Botón de regreso -->
        <button class="btn btn-back" onclick="goBack()">
            <span>←</span> Volver al Inicio
        </button>

        <div class="header">
            <h1>💉 Vacunas</h1>
            <p>Control de vacunación y calendarios para mascotas</p>
        </div>

        <button class="btn btn-primary btn-lg mb-4" data-bs-toggle="modal" data-bs-target="#modalVacuna">
            Crear Vacuna
        </button>

        <!-- MODAL -->
        <div class="modal fade" id="modalVacuna" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nueva Vacuna</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="vacunaFormulario">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Código:</label>
                                    <input type="text" class="form-control" id="codigoVacuna" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre:</label>
                                    <input type="text" class="form-control" id="nombreVacuna" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción:</label>
                                <textarea class="form-control" id="descripcionVacuna" rows="3" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Aplicable A (separado por comas):</label>
                                <input type="text" class="form-control" id="aplicableAVacuna" 
                                       placeholder="Ej: Perro, Gato, Conejo" required>
                                <div class="form-text">Lista de animales a los que se puede aplicar esta vacuna</div>
                            </div>

                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="reset" class="btn btn-danger">Limpiar</button>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-container mt-4">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Aplicable A</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaVacunas">
                        <!-- Los datos se cargarán aquí dinámicamente desde la base de datos -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function goBack() {
            window.location.href = '../index.html';
        }
    </script>
    <script src="../js/vacunas.js"></script>
</body>
</html>
