<!doctype html>
<html lang="en">
<head>
    <title>Vacunas</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

    <div class="container mt-4">

        <h1 class="text-center">Vacunas</h1>

        <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#modalVacuna">
            Crear Vacuna
        </button>

        <!-- MODAL -->
        <div class="modal fade" id="modalVacuna" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nueva Vacuna</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="vacunaFormulario">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Código:</label>
                                    <input type="text" class="form-control" id="codigoVacuna" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre:</label>
                                    <input type="text" class="form-control" id="nombreVacuna" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción:</label>
                                <textarea class="form-control" id="descripcionVacuna" rows="3" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Aplicable A (separado por comas):</label>
                                <input type="text" class="form-control" id="aplicableAVacuna" 
                                       placeholder="Ej: Perro, Gato, Conejo" required>
                                <div class="form-text">Lista de animales a los que se puede aplicar esta vacuna</div>
                            </div>

                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="reset" class="btn btn-danger">Limpiar</button>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-responsive mt-4">
            <table class="table table-striped table-bordered">
                <thead class="table-primary">
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Aplicable A</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaVacunas"></tbody>
            </table>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/vacunas.js"></script>
</body>
</html>
