<!doctype html>
<html lang="es">
<head>
    <title>Parte Médico</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/estilo.css" rel="stylesheet" />
</head>
<body>

    <div class="container mt-4">
        <!-- Botón de regreso -->
        <button class="btn btn-back" onclick="goBack()">
            <span>←</span> Volver al Inicio
        </button>

        <div class="header">
            <h1>🏥 Parte Médico</h1>
            <p>Gestiona los registros médicos e historiales de salud de las mascotas</p>
        </div>

        <button class="btn btn-primary btn-lg mb-4" data-bs-toggle="modal" data-bs-target="#modalParteMedico">
            Crear Parte Médico
        </button>

        <!-- MODAL -->
        <div class="modal fade" id="modalParteMedico" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nuevo Parte Médico</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="parteMedicoFormulario">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">ID Historial:</label>
                                    <input type="text" class="form-control" id="idHistorial" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Mascota:</label>
                                    <input type="text" class="form-control" id="mascota" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha:</label>
                                    <input type="date" class="form-control" id="fecha" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Veterinario:</label>
                                    <input type="text" class="form-control" id="veterinario" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Diagnóstico:</label>
                                <textarea class="form-control" id="diagnostico" rows="3" required></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Tratamiento:</label>
                                <textarea class="form-control" id="tratamiento" rows="3" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Próxima Cita:</label>
                                <input type="date" class="form-control" id="proximaCita" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="reset" class="btn btn-danger">Limpiar</button>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-container mt-4">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Mascota</th>
                            <th>Fecha</th>
                            <th>Veterinario</th>
                            <th>Diagnóstico</th>
                            <th>Tratamiento</th>
                            <th>Próxima Cita</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaParteMedico">
                        
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function goBack() {
            window.location.href = '../index.html';
        }
    </script>
    <script src="../js/partemedico.js"></script>
</body>
</html>
