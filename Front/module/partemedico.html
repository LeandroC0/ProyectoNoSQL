<!doctype html>
<html lang="en">
<head>
    <title>Parte Medico</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

    <div class="container mt-4">

        <h1 class="text-center">Parte Medico</h1>

        <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#modalParteMedico">
            Crear Parte Medico
        </button>

        <!-- MODAL -->
        <div class="modal fade" id="modalParteMedico" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nuevo Parte Medico</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="tipoFormulario">

                            <div class="mb-3">
                                <label class="form-label">ID Historial:</label>
                                <input type="text" class="form-control" id="idHistorial" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mascota:</label>
                                <input type="text" class="form-control" id="mascota" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Fecha:</label>
                                <textarea class="form-control" id="fecha" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Veterinario:</label>
                                <textarea class="form-control" id="veterinario" required></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Diagnostico:</label>
                                <textarea class="form-control" id="diagnostico" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Tratamiento:</label>
                                <textarea class="form-control" id="tratamiento" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Proxima Cita:</label>
                                <textarea class="form-control" id="proximaCita" required></textarea>
                            </div>

                            
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="reset" class="btn btn-danger">Limpiar</button>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-responsive mt-4">
            <table class="table table-striped table-bordered">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Mascota</th>
                        <th>Fecha</th>
                        <th>Veterinario</th>
                        <th>Diagnostico</th>
                        <th>Tratamiento</th>
                        <th>ProximaCita</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaParteMedico"></tbody>
            </table>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/partemedico.js"></script>
</body>
</html>
