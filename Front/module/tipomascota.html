<!doctype html>
<html lang="es">
<head>
    <title>Tipos de Mascota</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/estilo.css" rel="stylesheet" />
</head>
<body>

    <div class="container mt-4">
        <!-- Botón de regreso -->
        <button class="btn btn-back" onclick="goBack()">
            <span>←</span> Volver al Inicio
        </button>

        <div class="header">
            <h1>🏷️ Tipos de Mascotas</h1>
            <p>Gestiona las categorías y tipos de mascotas disponibles</p>
        </div>

        <button class="btn btn-primary btn-lg mb-4" data-bs-toggle="modal" data-bs-target="#modalTipoMascota">
            Crear Tipo
        </button>

        <!-- MODAL -->
        <div class="modal fade" id="modalTipoMascota" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nuevo Tipo de Mascota</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="tipoFormulario">

                            <div class="mb-3">
                                <label class="form-label">ID Tipo:</label>
                                <input type="text" class="form-control" id="tipoMascotaId" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Nombre:</label>
                                <input type="text" class="form-control" id="nombreTipo" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción:</label>
                                <textarea class="form-control" id="descripcionTipo" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="reset" class="btn btn-danger">Limpiar</button>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-container mt-4">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaTipos">
                        
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function goBack() {
            window.location.href = '../index.html';
        }
    </script>
    <script src="../js/tipoMascota.js"></script>
</body>
</html>
