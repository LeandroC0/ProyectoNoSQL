<!doctype html>
<html lang="es">
<head>
    <title>Notificaciones</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/estilo.css" rel="stylesheet" />
</head>
<body>

    <div class="container mt-4">
        <!-- Botón de regreso -->
        <button class="btn btn-back" onclick="goBack()">
            <span>←</span> Volver al Inicio
        </button>

        <div class="header">
            <h1>🔔 Notificaciones</h1>
            <p>Gestiona las notificaciones del sistema para los usuarios</p>
        </div>

        <button class="btn btn-primary btn-lg mb-4" data-bs-toggle="modal" data-bs-target="#modalNotificaciones">
            Crear Notificación
        </button>

        <!-- MODAL -->
        <div class="modal fade" id="modalNotificaciones" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nueva Notificación</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="notificacionesFormulario">
                            <div class="mb-3">
                                <label class="form-label">ID Notificación:</label>
                                <input type="text" class="form-control" id="idNotificacion" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Usuario:</label>
                                <input type="text" class="form-control" id="usuario" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mensaje:</label>
                                <textarea class="form-control" id="mensaje" rows="3" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Tipo:</label>
                                <select class="form-control" id="tipo" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="Sistema">Sistema</option>
                                    <option value="Adopción">Adopción</option>
                                    <option value="Recordatorio">Recordatorio</option>
                                    <option value="Alerta">Alerta</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Leída:</label>
                                <select class="form-control" id="leida" required>
                                    <option value="">Seleccionar...</option>
                                    <option value="true">Sí</option>
                                    <option value="false">No</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Fecha:</label>
                                <input type="date" class="form-control" id="fecha" required>
                            </div>
                            
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="reset" class="btn btn-danger">Limpiar</button>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-container mt-4">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Mensaje</th>
                            <th>Tipo</th>
                            <th>Leída</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaNotificaciones">
                        
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function goBack() {
            window.location.href = '../index.html';
        }
    </script>
    <script src="../js/notificaciones.js"></script>
</body>
</html>
