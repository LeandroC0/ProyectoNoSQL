<!doctype html>
<html lang="es">
<head>
    <title>Registros</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/estilo.css" rel="stylesheet" />
</head>
<body>

    <div class="container mt-4">
        <!-- Botón de regreso -->
        <button class="btn btn-back" onclick="goBack()">
            <span>←</span> Volver al Inicio
        </button>

        <div class="header">
            <h1>📊 Registros</h1>
            <p>Historial de actividades y movimientos del sistema</p>
        </div>

        <button class="btn btn-primary btn-lg mb-4" data-bs-toggle="modal" data-bs-target="#modalRegistro">
            Crear Registro
        </button>

        <!-- MODAL -->
        <div class="modal fade" id="modalRegistro" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nuevo Registro</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="registroFormulario">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Usuario:</label>
                                    <input type="text" class="form-control" id="usuarioRegistro" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Acción:</label>
                                    <select class="form-control" id="accionRegistro" required>
                                        <option value="">Seleccionar...</option>
                                        <option value="Ingreso">Ingreso</option>
                                        <option value="Adopción">Adopción</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Mascota:</label>
                                    <input type="text" class="form-control" id="mascotaRegistro" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha:</label>
                                    <input type="date" class="form-control" id="fechaRegistro" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción:</label>
                                <textarea class="form-control" id="descripcionRegistro" rows="3" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="reset" class="btn btn-danger">Limpiar</button>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-container mt-4">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th>Acción</th>
                            <th>Mascota</th>
                            <th>Fecha</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaRegistros">
                        
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function goBack() {
            window.location.href = '../index.html';
        }
    </script>
    <script src="../js/registros.js"></script>
</body>
</html>
