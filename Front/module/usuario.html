<!doctype html>
<html lang="es">

<head>
    <title>Usuarios</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/estilo.css" rel="stylesheet" />
</head>

<body>
    <div class="container mt-4">
        <!-- Botón de regreso -->
        <button class="btn btn-back" onclick="goBack()">
            <span>←</span> Volver al Inicio
        </button>

        <div class="header">
            <h1>👥 Usuarios</h1>
            <p>Gestiona los usuarios del sistema y sus permisos</p>
        </div>

        <button type="button" class="btn btn-primary btn-lg mb-4" data-bs-toggle="modal" data-bs-target="#modalUsuario">
            Crear Usuario
        </button>

        <!-- MODAL CREAR USUARIO -->
        <div class="modal fade" id="modalUsuario" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nuevo Usuario</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="usuarioFormulario">

                            <div class="mb-3">
                                <label class="form-label">Nombre:</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Correo:</label>
                                <input type="email" class="form-control" id="correo" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Teléfono:</label>
                                <input type="text" class="form-control" id="telefono" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Dirección:</label>
                                <input type="text" class="form-control" id="direccion" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Rol:</label>
                                <select class="form-select" id="rol" required>
                                    <option value="adoptante">Adoptante</option>
                                    <option value="refugio">Refugio</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Fecha Registro:</label>
                                <input type="date" class="form-control" id="fechaRegistro" required>
                            </div>

                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="reset" class="btn btn-danger">Limpiar</button>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cerrar
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-container mt-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Rol</th>
                            <th>Fecha Registro</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaDatos">
                        
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function goBack() {
            window.location.href = '../index.html';
        }
    </script>
    <script src="../js/usuario.js"></script>
</body>

</html>
