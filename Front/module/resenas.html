<!doctype html>
<html lang="en">
<head>
    <title>Reseñas</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

    <div class="container mt-4">

        <h1 class="text-center">Reseñas</h1>

        <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#modalResena">
            Crear Reseña
        </button>

        <!-- MODAL -->
        <div class="modal fade" id="modalResena" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nueva Reseña</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="resenaFormulario">
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Usuario:</label>
                                    <input type="text" class="form-control" id="usuarioResena" required>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Mascota:</label>
                                    <input type="text" class="form-control" id="mascotaResena" required>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Refugio:</label>
                                    <input type="text" class="form-control" id="refugioResena" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Calificación:</label>
                                    <select class="form-control" id="calificacionResena" required>
                                        <option value="">Seleccionar...</option>
                                        <option value="1">1 ★</option>
                                        <option value="2">2 ★★</option>
                                        <option value="3">3 ★★★</option>
                                        <option value="4">4 ★★★★</option>
                                        <option value="5">5 ★★★★★</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fecha:</label>
                                    <input type="date" class="form-control" id="fechaResena" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Comentario:</label>
                                <textarea class="form-control" id="comentarioResena" rows="4" required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="reset" class="btn btn-danger">Limpiar</button>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-responsive mt-4">
            <table class="table table-striped table-bordered">
                <thead class="table-primary">
                    <tr>
                        <th>Usuario</th>
                        <th>Mascota</th>
                        <th>Refugio</th>
                        <th>Calificación</th>
                        <th>Comentario</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaResenas"></tbody>
            </table>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/resenas.js"></script>
</body>
</html>
