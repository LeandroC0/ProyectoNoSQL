<!doctype html>
<html lang="es">
<head>
    <title>Mascotas</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/estilo.css" rel="stylesheet" />
</head>
<body>

    <div class="container mt-4">
        <!-- Botón de regreso -->
        <button class="btn btn-back" onclick="goBack()">
            <span>←</span> Volver al Inicio
        </button>

        <div class="header">
            <h1>🐾 Mascotas</h1>
            <p>Administra el registro de mascotas disponibles para adopción</p>
        </div>

        <button class="btn btn-primary btn-lg mb-4" data-bs-toggle="modal" data-bs-target="#modalMascota">
            Crear Mascota
        </button>

        <!-- MODAL -->
        <div class="modal fade" id="modalMascota" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Nueva Mascota</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <form id="mascotaFormulario">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre:</label>
                                    <input type="text" class="form-control" id="nombreMascota" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Tipo Mascota ID:</label>
                                    <input type="text" class="form-control" id="tipoMascotaId" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Raza:</label>
                                    <input type="text" class="form-control" id="razaMascota" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Edad:</label>
                                    <input type="number" class="form-control" id="edadMascota" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Sexo:</label>
                                    <select class="form-control" id="sexoMascota" required>
                                        <option value="">Seleccionar...</option>
                                        <option value="Macho">Macho</option>
                                        <option value="Hembra">Hembra</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Estado:</label>
                                    <select class="form-control" id="estadoMascota" required>
                                        <option value="">Seleccionar...</option>
                                        <option value="Disponible">Disponible</option>
                                        <option value="Adoptado">Adoptado</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Vacunas (separadas por comas):</label>
                                <input type="text" class="form-control" id="vacunasMascota" 
                                       placeholder="Ej: Rabia, Parvovirus, Moquillo" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Refugio:</label>
                                <input type="text" class="form-control" id="refugioMascota" required>
                            </div>

                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="reset" class="btn btn-danger">Limpiar</button>

                        </form>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>

                </div>
            </div>
        </div>

        <!-- TABLA -->
        <div class="table-container mt-4">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Tipo ID</th>
                            <th>Raza</th>
                            <th>Edad</th>
                            <th>Sexo</th>
                            <th>Vacunas</th>
                            <th>Estado</th>
                            <th>Refugio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaMascotas">
                        
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function goBack() {
            window.location.href = '../index.html';
        }
    </script>
    <script src="../js/mascotas.js"></script>
</body>
</html>
